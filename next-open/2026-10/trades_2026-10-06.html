// P5 (2026-08-05 review): bars_to_chart_json.to_unix()/_chart_unix() encode UK
// wall-clock time as a "reinterpreted as UTC" unix timestamp -- a deliberate trick
// that only shows the correct digits if this chart reads time back as literal UTC.
// Lightweight Charts' default formatter uses the BROWSER's local timezone instead,
// which silently adds the viewer's own UTC offset on top (+1h during BST, +0h during
// GMT -- why this went unnoticed outside summer months). Force UTC everywhere time
// is rendered so the trick's assumption actually holds regardless of viewer/DST.
function utcHHMM(time) {
  const d = new Date(time * 1000);
  return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
}
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
  grid: { vertLines: { color: '#222633' }, horzLines: { color: '#222633' } },
  timeScale: { timeVisible: true, secondsVisible: false, tickMarkFormatter: utcHHMM },
  localization: { timeFormatter: utcHHMM },
});

chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.1, bottom: 0.3 } });

const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
  upColor: '#26a69a', downColor: '#ef5350',
  borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  priceLineVisible: false,
});

const vwapSeries = chart.addSeries(LightweightCharts.LineSeries, {
  color: '#f0b90b', lineWidth: 2,
  priceLineVisible: false,
});

const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
  priceFormat: { type: 'volume' },
  priceScaleId: 'volume',
  lastValueVisible: false,
  priceLineVisible: false,
});
chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.75, bottom: 0 } });

// Single persistent marker primitive, reused via setMarkers() on every switch --
// never re-created/detached. Repeated createSeriesMarkers()/detachPrimitive() throws
// once a ticker with zero markers is followed by another switch, which silently killed
// the whole render() call (chart looked frozen on ticker switch).
const markerPrimitive = LightweightCharts.createSeriesMarkers(candleSeries, []);
let volumeByTime = new Map();
let vwapPctByTime = new Map();
let priceLines = [];

function render(data) {
  document.getElementById('title').textContent = `${data.symbol} — ${data.date}`;
  // re-enable autoscale on switch -- a prior price-axis drag/scroll on any chart
  // pins the right/volume price scales to that chart's range, and setData() alone
  // doesn't undo it, so the next symbol renders with a stale price range (candles
  // scaled off-screen even though tooltip data is correct) until a hard reload.
  chart.priceScale('right').applyOptions({ autoScale: true });
  chart.priceScale('volume').applyOptions({ autoScale: true });
  candleSeries.setData(data.candles);
  vwapSeries.setData(data.vwap);
  volumeSeries.setData(data.volume || []);
  volumeByTime = new Map((data.volume || []).map(v => [v.time, v.value]));
  vwapPctByTime = new Map((data.vwap || []).map(v => [v.time, v.vs_vwap_pct]));
  // drop reasoning text — arrow alone flags the candidate, text clutters the chart
  markerPrimitive.setMarkers((data.markers || []).map(m => ({ ...m, text: '' })));
  chart.timeScale().fitContent();
  clearLines(); // manual lines don't carry meaning across a different ticker's price scale
  endDrag();
  if (drawMode) drawBtn.click(); // leave Draw off on a switch, pan/zoom restored
  measureResult.textContent = '';
}

function clearLines() {
  priceLines.forEach(l => candleSeries.removePriceLine(l));
  priceLines = [];
}
document.getElementById('clearLines').addEventListener('click', () => {
  clearLines();
  endDrag();
  measureResult.textContent = '';
});

// Tool switch: "Line" drops a single reference line per drag; "Range" drags out a
// $/% readout between two prices (profit-target / stop-loss sizing from a breakout
// point). Two separate drag handlers below, selected by `rangeTool`, not one shared
// function with a branch buried inside.
let rangeTool = false;
const measureBtn = document.getElementById('measureToggle');
const measureResult = document.getElementById('measureResult');
measureBtn.addEventListener('click', () => {
  rangeTool = !rangeTool;
  endDrag();
  measureResult.textContent = '';
  measureBtn.textContent = `Tool: ${rangeTool ? 'Range' : 'Line'}`;
});

function addPriceLine(price, color) {
  const line = candleSeries.createPriceLine({
    price, color, lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible: true,
    title: price.toFixed(4),
  });
  priceLines.push(line);
  return line;
}

// Drag state shared by both tools' handlers below.
let hoverPoint = null;      // last {point} from crosshairMove, used to seed mousedown price
let isDragging = false;
let dragAnchorPrice = null; // range tool only
let dragPreviewLine = null; // the line that tracks the cursor during a drag

function endDrag() {
  isDragging = false;
  dragAnchorPrice = null;
  dragPreviewLine = null;
}

function priceAtPoint(point) {
  return point ? candleSeries.coordinateToPrice(point.y) : null;
}

function startLineDrag(price) {
  dragPreviewLine = addPriceLine(price, '#e0e0e0');
}

function startRangeDrag(price) {
  addPriceLine(price, '#4a90e2'); // anchor, fixed for this drag
  dragAnchorPrice = price;
  dragPreviewLine = addPriceLine(price, '#e0e0e0'); // tracks the cursor until mouseup
  measureResult.textContent = `Anchor ${price.toFixed(4)} — drag to end point`;
}

function updateRangeDrag(price) {
  const diff = price - dragAnchorPrice;
  const pct = dragAnchorPrice ? (diff / dragAnchorPrice * 100) : 0;
  const sign = diff >= 0 ? '+' : '';
  dragPreviewLine.applyOptions({
    price, title: price.toFixed(4),
    color: diff >= 0 ? '#26a69a' : '#ef5350',
  });
  measureResult.textContent = `Range: ${sign}${diff.toFixed(4)} (${sign}${pct.toFixed(2)}%)`;
}

// Two ways in, one drag engine: a mouse user holds Shift and drags; a touch user
// turns Draw on (a phone has no Shift key) and drags one finger. Both tools (Line and
// Range) are driven by the same begin/update/finish below, so neither input can end up
// supporting a tool the other doesn't (failure class 2 -- the touch path was the
// missing sibling until 2026-09-22).
const chartEl = document.getElementById('chart');

function priceAtClientY(clientY) {
  // The chart container's top edge IS the top of the price pane, so a page-space y
  // maps onto the series the same way the crosshair's own point.y does.
  const rect = chartEl.getBoundingClientRect();
  return candleSeries.coordinateToPrice(clientY - rect.top);
}

function beginDrag(price) {
  if (price === null || price === undefined) return;
  isDragging = true;
  if (rangeTool) startRangeDrag(price); else startLineDrag(price);
}

function updateDrag(price) {
  if (price === null || price === undefined || !dragPreviewLine) return;
  if (rangeTool) updateRangeDrag(price);
  else dragPreviewLine.applyOptions({ price, title: price.toFixed(4) });
}

function finishDrag() {
  if (!isDragging) return;
  if (rangeTool && dragAnchorPrice !== null) {
    measureResult.textContent += ' — drag a new range to remeasure';
  }
  endDrag();
}

// Draw mode: while on, the chart's own pan/zoom is switched off and a plain drag
// (finger or mouse) draws instead. Turning it off hands pan/zoom straight back.
let drawMode = false;
const drawBtn = document.getElementById('drawToggle');
drawBtn.addEventListener('click', () => {
  drawMode = !drawMode;
  endDrag();
  drawBtn.textContent = `Draw: ${drawMode ? 'ON' : 'off'}`;
  drawBtn.classList.toggle('on', drawMode);
  chartEl.classList.toggle('drawing', drawMode);
  chart.applyOptions({ handleScroll: !drawMode, handleScale: !drawMode });
});

chartEl.addEventListener('mousedown', e => {

  e.stopPropagation();
  e.preventDefault();
  beginDrag(priceAtClientY(e.clientY));
}, true);
window.addEventListener('mouseup', finishDrag);

chartEl.addEventListener('touchstart', e => {
  if (!drawMode) return;
  if (e.touches.length > 1) { endDrag(); return; }  // two fingers: not a draw
  e.stopPropagation();
  e.preventDefault();
  beginDrag(priceAtClientY(e.touches[0].clientY));
}, { capture: true, passive: false });
chartEl.addEventListener('touchmove', e => {
  if (!isDragging) return;
  if (e.touches.length > 1) { endDrag(); return; }
  e.stopPropagation();
  e.preventDefault();
  updateDrag(priceAtClientY(e.touches[0].clientY));
}, { capture: true, passive: false });
chartEl.addEventListener('touchend', finishDrag, { capture: true });
chartEl.addEventListener('touchcancel', () => endDrag(), { capture: true });

const tooltip = document.getElementById('tooltip');
chart.subscribeCrosshairMove(param => {
  hoverPoint = param.point || null;

  if (isDragging) updateDrag(priceAtPoint(hoverPoint));

  if (!param.time || !param.point) {
    tooltip.style.display = 'none';
    return;
  }
  const bar = param.seriesData.get(candleSeries);
  if (!bar) {
    tooltip.style.display = 'none';
    return;
  }
  const vol = volumeByTime.get(param.time);
  const volText = vol === undefined ? 'n/a' : vol.toLocaleString();
  const vwapPct = vwapPctByTime.get(param.time);
  const vwapText = vwapPct === undefined ? 'n/a' : `${vwapPct.toFixed(2)}%`;
  // body/lower-wick size, both $ and %-of-close (matches the manual review metric
  // used throughout strategy_knowledge/08_open_questions.md Q25/Q26)
  const body = Math.abs(bar.close - bar.open);
  const lowerWick = Math.min(bar.open, bar.close) - bar.low;
  const bodyPct = bar.close ? (body / bar.close * 100) : 0;
  const wickPct = bar.close ? (lowerWick / bar.close * 100) : 0;
  tooltip.innerHTML =
    `O ${bar.open} H ${bar.high} L ${bar.low} C ${bar.close} &nbsp; Vol ${volText} &nbsp; vs VWAP ${vwapText}` +
    `<br>Body $${body.toFixed(4)} (${bodyPct.toFixed(2)}%) &nbsp; Wick $${lowerWick.toFixed(4)} (${wickPct.toFixed(2)}%)`;
  tooltip.style.display = 'block';
});

const picker = document.getElementById('chartPicker');
Object.keys(DATA).sort().forEach(key => {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = key;
  picker.appendChild(opt);
});
picker.addEventListener('change', () => render(DATA[picker.value]));
if (picker.options.length) { picker.selectedIndex = 0; render(DATA[picker.value]); }

new ResizeObserver(entries => {
  const { width, height } = entries[0].contentRect;
  chart.applyOptions({ width, height });
}).observe(document.getElementById('chart'));
</script>
</body>
